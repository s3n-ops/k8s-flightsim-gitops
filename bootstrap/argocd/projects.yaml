# Argo CD projects. Applied with Argo CD itself (just argocd), not by the
# app of apps, so a push to this repository cannot widen its own rights.

# platform: cluster services. May create cluster-scoped resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Cluster services (storage, operators) and the app of apps
  sourceRepos:
    - https://github.com/s3n-ops/k8s-flightsim-gitops.git
    - https://cloudnative-pg.github.io/charts
    - https://charts.jetstack.io
    - registry-1.docker.io/envoyproxy
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: local-path-storage
    - server: https://kubernetes.default.svc
      namespace: cnpg-system
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
    - server: https://kubernetes.default.svc
      namespace: gateway
    - server: https://kubernetes.default.svc
      namespace: velero
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    # Shipped with the Gateway API CRDs: blocks CRD downgrades.
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: gateway.networking.k8s.io
      kind: GatewayClass
---
# apps: workloads. Namespaced resources only, plus their own Namespace
# (CreateNamespace=true).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Workloads, no cluster-wide rights
  sourceRepos:
    - https://github.com/s3n-ops/k8s-flightsim-gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: miniflux
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
---
# default: locked down, every Application must name platform or apps.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
