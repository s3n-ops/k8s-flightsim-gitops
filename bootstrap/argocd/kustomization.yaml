# Argo CD itself. Installed once by hand (just argocd in the lab repo):
#   kubectl apply --server-side -k bootstrap/argocd
# HA manifest: two API and repo servers, Redis HA with Sentinel. Needs three
# schedulable nodes (required pod anti-affinity), the three workers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/ha/install.yaml
  - projects.yaml
patches:
  # TLS ends at the lab Gateway, argocd-server serves plain HTTP behind it.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: https://argocd.k8s-flightsim.internal
        # Argo CD has no built-in health check for Applications. Without
        # it, a child Application counts as healthy right after its apply,
        # and the sync waves of root do not wait for each other.
        resource.customizations.health.argoproj.io_Application: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil and obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
          return hs
