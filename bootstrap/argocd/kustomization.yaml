# Argo CD itself. Installed once by hand (just argocd in the lab repo):
#   kubectl apply --server-side -k bootstrap/argocd
# HA manifest: two API and repo servers, Redis HA with Sentinel. Needs three
# schedulable nodes (required pod anti-affinity), the three workers.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/ha/install.yaml
  - projects.yaml
patches:
  # TLS ends at the lab Gateway, argocd-server serves plain HTTP behind it.
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        url: https://argocd.k8s-flightsim.internal
