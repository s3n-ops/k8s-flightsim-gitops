apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: miniflux
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/s3n-ops/k8s-flightsim-gitops.git
    targetRevision: main
    path: apps/miniflux
  destination:
    server: https://kubernetes.default.svc
    namespace: miniflux
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      # The Cluster CRD may not exist yet on the first sync.
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
