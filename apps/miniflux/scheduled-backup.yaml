# Base backup every six hours. The lab is not always running, and a cron
# schedule does not catch up, so the interval is short. WAL archiving runs
# continuously in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: miniflux-db
spec:
  schedule: "0 0 */6 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: miniflux-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
