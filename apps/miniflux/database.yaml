# Three instances: one primary, two streaming replicas, spread over the
# workers. CNPG creates Secret "miniflux-db-app" (key "uri") for the app.
# Velero skips the pods and volumes: a file copy of a running database is
# not consistent. The Barman Cloud plugin archives the WAL and takes the
# base backups instead (object-store.yaml, scheduled-backup.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-db
spec:
  instances: 3
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup
  storage:
    storageClass: local-path
    size: 2Gi
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
