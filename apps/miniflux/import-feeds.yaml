# Imports the starter feeds from feeds.opml through the Miniflux API after
# every sync. Miniflux skips feeds that already exist, so the Job can run
# again and again. Feeds added or removed by hand stay as they are.
apiVersion: batch/v1
kind: Job
metadata:
  name: import-feeds
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          image: curlimages/curl:8.22.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-admin
                  key: ADMIN_PASSWORD
          # The credentials go to curl on stdin (-K -), not on the command line.
          command:
            - sh
            - -c
            - |
              set -eu
              url=http://miniflux.miniflux.svc
              until curl -fsS -o /dev/null "$url/healthcheck"; do
                echo "waiting for Miniflux"
                sleep 5
              done
              # curl config syntax: escape backslashes and double quotes.
              credentials=$(printf '%s:%s' "$ADMIN_USERNAME" "$ADMIN_PASSWORD" | sed 's/[\\"]/\\&/g')
              printf 'user = "%s"\n' "$credentials" |
                curl -fsS -K - -X POST -H "Content-Type: application/xml" \
                  --data-binary @/feeds/feeds.opml "$url/v1/import"
              echo
          volumeMounts:
            - name: feeds
              mountPath: /feeds
              readOnly: true
      volumes:
        - name: feeds
          configMap:
            name: miniflux-feeds
