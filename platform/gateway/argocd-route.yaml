# Argo CD web UI and API (gRPC-web) through the lab Gateway. Lives in the
# argocd namespace: the https-argocd listener accepts routes only from there.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https-argocd
  hostnames:
    - argocd.k8s-flightsim.internal
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
